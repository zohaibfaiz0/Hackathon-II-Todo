apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-secrets
type: Opaque
stringData:
  # In real production, use external secret store.
  # For hackathon/local, we use values or placeholders.
  GEMINI_API_KEY: "{{ .Values.backend.secrets.geminiApiKey | default "fake-key-for-build" }}"
  SECRET_KEY: "{{ .Values.backend.secrets.secretKey | default "insecure-dev-secret" }}"
  POSTGRES_PASSWORD: "{{ .Values.postgres.auth.password }}"
  # Constructed Database URL
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "todo-app.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
